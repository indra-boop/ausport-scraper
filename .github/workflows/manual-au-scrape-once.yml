name: Manual AU Scrape Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-au-scrape-once.yml'

permissions:
  contents: write

concurrency:
  group: production-schedule-sync
  cancel-in-progress: false

jobs:
  production-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
      DASHBOARD_INGEST_URL: https://schedule.jerconetwork.com/api/ingest
      DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
      MINIMUM_EVENT_ROWS: '1'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in DASHBOARD_INGEST_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y chromium
          echo "PUPPETEER_EXECUTABLE_PATH=$(which chromium)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run guarded production sync
        run: node scraper.js

      - name: Verify AU channel prefixes
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          with open('results.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          channels = []
          for row in rows:
              channels.extend([part.strip() for part in row.get('channels', '').split('|') if part.strip()])
          if not channels:
              raise SystemExit('No channel values found in results.csv')
          bad = [channel for channel in channels if not channel.startswith('[AU] ')]
          if bad:
              raise SystemExit(f'Unprefixed AU channels found: {bad[:5]}')
          print(f'AU prefix verified on {len(channels)} channel values across {len(rows)} rows')
          PY

      - name: Commit verified CSV when changed
        shell: bash
        run: |
          set -euo pipefail
          file='results.csv'
          if git diff --quiet -- "$file"; then
            echo 'No schedule change detected.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$file"
          git commit -m 'chore: manual AU schedule sync with country prefixes'
          git push
