name: Apply AU Channel Prefix Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-country-prefix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch scraper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scraper.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "const TARGET_TZ = 'Asia/Makassar';\n",
              "const TARGET_TZ = 'Asia/Makassar';\nconst COUNTRY_CODE = 'AU';\n",
              'country constant',
          )

          replace_once(
              """function splitChannels(s) {
            return String(s || '')
              .split('|')
              .map((v) => v.trim())
              .filter(Boolean);
          }
          """,
              """function stripCountryPrefix(name) {
            return String(name || '').replace(/^\\[[A-Z]{2}\\]\\s*/i, '').trim();
          }

          function prefixChannelName(name, countryCode = COUNTRY_CODE) {
            const raw = stripCountryPrefix(name);
            return raw ? `[${countryCode}] ${raw}` : '';
          }

          function splitChannels(s) {
            return String(s || '')
              .split('|')
              .map((v) => stripCountryPrefix(v))
              .filter(Boolean);
          }

          function prefixChannelList(s) {
            return splitChannels(s)
              .map((name) => prefixChannelName(name))
              .join(' | ');
          }
          """,
              'channel helpers',
          )

          replace_once(
              "  allRows = freshness.rows;\n  console.log(\n",
              """  allRows = freshness.rows.map((row) => ({
            ...row,
            channels: prefixChannelList(row.channels),
          }));
          console.log(
          """,
              'output enrichment',
          )

          replace_once(
              "    splitChannels,\n",
              "    splitChannels,\n    stripCountryPrefix,\n    prefixChannelName,\n    prefixChannelList,\n",
              'exports',
          )

          replace_once(
              "    TARGET_TZ\n",
              "    TARGET_TZ,\n    COUNTRY_CODE\n",
              'country export',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate syntax and country helpers
        shell: bash
        run: |
          node --check scraper.js
          node - <<'NODE'
          const s = require('./scraper.js');
          if (s.COUNTRY_CODE !== 'AU') throw new Error('COUNTRY_CODE is not AU');
          if (s.prefixChannelList('7Mate Sydney | Channel 7 Melbourne') !== '[AU] 7Mate Sydney | [AU] Channel 7 Melbourne') {
            throw new Error('AU prefix transformation failed');
          }
          if (s.prefixChannelList('[AU] ESPN | Kayo Sports') !== '[AU] ESPN | [AU] Kayo Sports') {
            throw new Error('AU prefix idempotency failed');
          }
          console.log('AU channel prefix checks passed');
          NODE

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scraper.js
          git diff --cached --check
          git commit -m 'feat: add AU country prefix to channels'
          git push
