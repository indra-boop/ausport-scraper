name: Production Schedule Sync

on:
  schedule:
    - cron: "0 0 * * *" # daily checker; heavy sync runs only when >=72h old
  workflow_dispatch:
  pull_request:
    paths:
      - "scraper.js"
      - ".github/workflows/scrape.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: production-schedule-sync
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate scraper syntax
        run: node --check scraper.js

  production-sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
      DASHBOARD_INGEST_URL: https://schedule.jerconetwork.com/api/ingest
      DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
      MINIMUM_EVENT_ROWS: "1"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Enforce 72-hour sync cadence
        id: cadence
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Cadence decision: manual run, bypassing 72-hour guard."
            exit 0
          fi
          last_sync_epoch="$(git log -1 --format=%ct -- results.csv || true)"
          now_epoch="$(date +%s)"
          age_seconds=$((now_epoch - ${last_sync_epoch:-0}))
          if [ -z "$last_sync_epoch" ] || [ "$age_seconds" -ge 259200 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Cadence decision: run; ageSeconds=$age_seconds."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Cadence decision: skip; ageSeconds=$age_seconds; required=259200."
          fi

      - name: Setup Node.js
        if: steps.cadence.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Validate production configuration
        if: steps.cadence.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in DASHBOARD_INGEST_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done

      - name: Install Chromium
        if: steps.cadence.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y chromium
          echo "PUPPETEER_EXECUTABLE_PATH=$(which chromium)" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: steps.cadence.outputs.should_run == 'true'
        run: npm ci

      - name: Run guarded production sync
        if: steps.cadence.outputs.should_run == 'true'
        run: node scraper.js

      - name: Commit verified CSV when changed
        if: steps.cadence.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          file="results.csv"

          if [ ! -f "$file" ]; then
            echo "No CSV was produced; refusing to commit." >&2
            exit 1
          fi

          if git diff --quiet -- "$file"; then
            echo "No schedule change detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$file"
          git commit -m "chore: sync sports schedule"
          git push
