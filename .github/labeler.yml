# Label path untuk PR router gratis (.github/workflows/pr-router.yml).
# Labeler tidak pernah menjalankan kode PR; file ini hanya konfigurasi pencocokan path.

scraper:
  - changed-files:
      - any-glob-to-any-file:
          - scraper.js
          - scraper-chunks/**
          - qc-rules.js

data:
  - changed-files:
      - any-glob-to-any-file:
          - results.csv
          - "*.csv"
          - baseline.json

governance:
  - changed-files:
      - any-glob-to-any-file:
          - CLAUDE.md

scripts:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**

tests:
  - changed-files:
      - any-glob-to-any-file:
          - test-fixtures/**
          - test-*.js

deps:
  - changed-files:
      - any-glob-to-any-file:
          - "**/package.json"
          - "**/package-lock.json"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "**/*.md"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
